id: core

groups:
  - { id: ad_block, name: "🛑 广告拦截", template: reject_first }
  - { id: private, name: "🏠 私有网络", template: direct_first }

rule-blocks:
  - id: ads
    target: ad_block
    providers:
      - { source: metacubex_geosite, name: category-ads-all }

  - id: private
    target: private
    providers:
      # DNS 策略、Fake-IP 排除和私有网络分流共用这一份管理域名清单。
      - id: router-management
        provider:
          type: inline
          behavior: domain
          format: yaml
        mihomo:
          payload:
            - asusrouter.com
            - www.asusrouter.com
            - router.asus.com
            - miwifi.com
            - www.miwifi.com
            - tplogin.cn
            - "+.tplinkwifi.net"
            - "+.zte.home"
            - routerlogin.com
            - www.routerlogin.com
            - "+.tendawifi.com"
            - "+.hiwifi.com"
            - "+.phicomm.me"
            - "+.peiluyou.com"
            - "+.leike.cc"
      - { source: metacubex_geosite, name: private }
      - { source: metacubex_geoip, name: private, no-resolve: true }
