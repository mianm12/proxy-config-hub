enable: true
listen: "127.0.0.1:5335"
use-system-hosts: false
use-hosts: true
ipv6: false
respect-rules: true
enhanced-mode: fake-ip
fake-ip-range: 198.18.0.1/16

default-nameserver:
  - 223.5.5.5#DIRECT
  - 119.29.29.29#DIRECT

nameserver:
  - "https://cloudflare-dns.com/dns-query#🚀 代理选择"
  - "https://dns.google/dns-query#🚀 代理选择"

nameserver-policy:
  "rule-set:router-management":
    - dhcp://en0
  "rule-set:cn,geolocation-cn":
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT

proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT

direct-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
direct-nameserver-follow-policy: true

fake-ip-filter:
  - "rule-set:router-management"
  - "rule-set:private"
  - "+.lan"
  - "+.local"
  - localhost
  - "stun.*.*.*"
  - "stun.*.*"
  - "time.*.com"
  - "ntp.*.com"
  - time.nist.gov
  - time.asia.apple.com
  - "*.ntp.org.cn"
  - "*.openwrt.pool.ntp.org"
  - "*.time.edu.cn"
  - time1.cloud.tencent.com
  - time.ustc.edu.cn
  - pool.ntp.org
  - localhost.ptlogin2.qq.com
  - "*.msftconnecttest.com"
  - "*.msftncsi.com"
  - "+.market.xiaomi.com"
  - "+.music.163.com"
  - "*.126.net"
